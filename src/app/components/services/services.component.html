<section id="services" class="services">
  <div class="container">
    <div class="section-header reveal-up">
      <span class="section-eyebrow">WHAT WE DO</span>
      <h2 class="section-title">Engineering Ideas Into Real Products</h2>
      <p class="section-desc">
        Choose the services you need or work with us through the complete product-development cycle.
      </p>
    </div>

    <div class="services-grid">
      <div class="service-card reveal-up" *ngFor="let service of services">
        <div class="service-card-inner">
          <div class="service-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path [attr.d]="service.icon" />
            </svg>
          </div>
          <h3 class="service-title">{{ service.title }}</h3>
          <p class="service-desc">{{ service.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
