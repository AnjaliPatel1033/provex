<header class="header" [class.scrolled]="isScrolled">
  <div class="container header-inner">
    <a href="#" class="logo">
      <img src="images/logo.png" alt="Provex Industries" class="logo-img">
    </a>

    <nav class="desktop-nav">
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#process">Process</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#industries">Industries</a></li>
      </ul>
    </nav>

    <div class="header-cta desktop-only">
      <a href="#contact" class="btn btn-primary">Start a Project</a>
    </div>

    <button class="mobile-toggle" (click)="toggleMobileMenu()">
      ☰
    </button>
  </div>

  <div class="mobile-menu" *ngIf="isMobileMenuOpen">
    <ul>
      <li><a href="#about" (click)="toggleMobileMenu()">About</a></li>
      <li><a href="#services" (click)="toggleMobileMenu()">Services</a></li>
      <li><a href="#process" (click)="toggleMobileMenu()">Process</a></li>
      <li><a href="#projects" (click)="toggleMobileMenu()">Projects</a></li>
      <li><a href="#industries" (click)="toggleMobileMenu()">Industries</a></li>
      <li><a href="#contact" class="btn btn-primary" (click)="toggleMobileMenu()">Start a Project</a></li>
    </ul>
  </div>
</header>
